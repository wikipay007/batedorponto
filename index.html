<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ponto</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Registro pessoal de ponto e jornada de trabalho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ponto.css">
</head>
<body>
<div id="loading-screen" role="status" aria-live="polite" aria-busy="true">
  <div class="loading-content">
    <span class="loading-spinner" aria-hidden="true"></span>
    <p>Carregando seus dados…</p>
  </div>
</div>

<div id="auth" hidden>
  <form id="lf">
    <h1>Ponto</h1>
    <input id="em" type="email" placeholder="E-mail" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required>
    <p id="ae"></p>
    <button>Entrar</button>
    <button type="button" id="cr">Criar conta</button>
  </form>
</div>

<div class="wrap">
  <header>
    <h1>Ponto</h1>
    <span><span id="st" class="mut"></span> <button id="out" style="min-height:32px;padding:4px 10px;margin-left:8px">Sair</button></span>
  </header>

  <section>
    <div class="nav">
      <button id="pv" aria-label="Dia anterior">‹</button>
      <input type="date" id="dt">
      <button id="nx" aria-label="Próximo dia">›</button>
      <button id="hj">Hoje</button>
    </div>
    <div id="draw"></div>
    <div class="grid" id="f"></div>
    <div class="day-settings">
      <label class="check" for="excused">
        <input id="excused" type="checkbox">
        Abonar este dia (feriado, atestado...)
      </label>
      <div class="fld">
        <label for="day-meta">Meta diária deste dia (horas)</label>
        <input id="day-meta" type="number" min="0" max="24" step=".25">
      </div>
    </div>
    <h2>Interrupções</h2>
    <div id="brk"></div>
    <button id="addb">Adicionar interrupção</button>
    <div class="sum" id="sum"></div>
  </section>

  <section>
    <div class="mhead">
      <button id="mp" aria-label="Período anterior">‹</button>
      <h2 id="mh"></h2>
      <button id="mn" aria-label="Próximo período">›</button>
    </div>
    <div class="tot" id="mt"></div>
    <div id="list"></div>
  </section>
</div>

<dialog id="photo-dialog" aria-labelledby="photo-dialog-title">
  <div class="photo-dialog-head">
    <h2 id="photo-dialog-title">Foto da marcação</h2>
    <button type="button" id="photo-dialog-close" aria-label="Fechar foto">Fechar</button>
  </div>
  <img id="photo-dialog-image" alt="">
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="ponto.js"></script>
</body>
</html>
